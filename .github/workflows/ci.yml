name: CI
on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test API
        run: python -m unittest discover -s app -p 'test_*.py' -v
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate infrastructure without Azure credentials
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate Kubernetes API schema
        run: |
          docker run --rm -v "$PWD/k8s:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /manifests
      - name: Scan configuration and secrets
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.65.0 fs --scanners misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Build container
        run: docker build --pull --build-arg APP_VERSION="$GITHUB_SHA" -t release-status:ci .
      - name: Scan container vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --exit-code 1 release-status:ci
      - name: Smoke test hardened container
        run: |
          docker run -d --name api --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 release-status:ci
          trap 'docker logs api; docker rm -f api' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/ | python -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["GITHUB_SHA"]'
